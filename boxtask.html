<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Box</title>
<style>
    .flex-container {
        display: flex;
        gap: 10px;
        margin-top: 20px;
    }
    .div1, .div2,.div3 {
        border: 2px solid;
        height: 250px;
        width: 250px;
        display: flex;
        justify-content: center;
        align-items: center;
        color: white;
        font-weight: bold;
    }
    .div1 { background-color: red; }
    .div2 { background-color: blue; }
    .div3 { background-color: yellow }
</style>
</head>
<body>
<script>
    // Buttons
    const colors = ["Red", "Green", "Blue", "Yellow", "Pink"];
    colors.forEach(color => {
        let btn = document.createElement("button");
        btn.innerHTML = color;
        document.body.appendChild(btn);
        btn.style.backgroundColor = color.toLowerCase();
        btn.style.marginRight = "10px";
        btn.style.width = "50px";
    });

    // Clear button
    let clearall = document.createElement("button");
    clearall.innerHTML = "Clear all";
    document.body.appendChild(clearall);
    clearall.style.marginLeft = "10px";
    clearall.style.width = "80px";

    // Flex parent
    let flexParent = document.createElement("div");
    flexParent.classList.add("flex-container");
    document.body.appendChild(flexParent);

    // Divs inside flex parent
    let div1 = document.createElement("div");
    div1.classList.add("div1");
    div1.innerHTML = "Div 1";
    flexParent.appendChild(div1);

    let div2 = document.createElement("div");
    div2.classList.add("div2");
    div2.innerHTML = "Div 2";
    flexParent.appendChild(div2);

    let div3 = document.createElement("div");
    div3.classList.add("div3");
    div3.innerHTML = "Div 3";
    flexParent.appendChild(div3);
</script>
</body>
</html>
